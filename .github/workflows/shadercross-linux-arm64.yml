name: Build Shadercross for Linux ARM64

run-name: Build Shadercross for Linux ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - spec-desktop-platform-portability-06
    paths:
      - .github/workflows/shadercross-linux-arm64.yml
      - Scripts/build-shadercross-linux-arm64.sh
      - Scripts/prepare-shadercross.sh
      - Shadercross/Manifest.json
      - Shadercross/RELEASE_NOTES.md
      - README.md

permissions:
  contents: read

concurrency:
  group: shadercross-linux-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_REVISION: 8e37db5e797b6167f3a00d697d816a684bd259c7
  SHADERCROSS_REVISION: e55cf5e31ced6f3d1be5cc6d0c50e99384f9f4ba
  SHADERCROSS_SHA256: 0b1fab54e52b22f055831b7e6e5e613e1fb21c0cc38d20057d9dd065b442cfbb

jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Check out the asset provenance
        uses: actions/checkout@v6

      - name: Check out the exact Shadercross source
        uses: actions/checkout@v6
        with:
          repository: libsdl-org/SDL_shadercross
          ref: ${{ env.SHADERCROSS_REVISION }}
          path: upstream
          submodules: recursive

      - name: Verify the native ARM64 host
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "expected a native ARM64 runner, got $(uname -m)" >&2; exit 1 ;;
          esac

      - name: Set up the exact SDL revision
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          cmake-generator: Ninja
          discriminator: shadercross-linux-arm64
          install-linux-dependencies: true
          version: ${{ env.SDL_REVISION }}

      - name: Install native build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y bison ninja-build patchelf

      - name: Build, execute, and normalize Shadercross
        shell: bash
        run: |
          set -euo pipefail
          Scripts/build-shadercross-linux-arm64.sh \
            "$GITHUB_WORKSPACE/upstream" \
            "${{ steps.sdl.outputs.prefix }}" \
            "$RUNNER_TEMP"
          echo "${{ env.SHADERCROSS_SHA256 }}  $RUNNER_TEMP/Shadercross-3.0.0-e55cf5e-linux-arm64.tar.gz" \
            | sha256sum -c -

      - name: Preserve the Linux ARM64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: shadercross-3.0.0-linux-arm64
          path: ${{ runner.temp }}/Shadercross-3.0.0-e55cf5e-linux-arm64.tar.gz
          retention-days: 7
          if-no-files-found: error
